[package]
name = "miios"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Spin locks: a "Mutex" that just spins while waiting (we have no OS to sleep on).
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "once"] }

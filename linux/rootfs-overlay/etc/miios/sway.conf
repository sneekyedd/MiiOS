# Sway configuration for MiiOS. Sway is the small "window manager" that
# shows one app at a time, full screen, each on its own workspace.

set $mod Mod4
font pango:DejaVu Sans 11
default_border none
default_floating_border none
focus_follows_mouse no
output * bg #F4F6FB solid_color
workspace_layout default
hide_edge_borders both
titlebar_border_thickness 0

input type:keyboard {
    xkb_layout us
    repeat_delay 350
    repeat_rate 30
}
input type:touchpad {
    tap enabled
    dwt enabled
    natural_scroll disabled
}

# The ⊞ (Windows) key on its own goes back to the MiiOS home screen.
bindsym --release Super_L exec miios-launch home
bindsym $mod+h exec miios-launch home
bindsym $mod+q exec miios-launch close
bindsym $mod+w exec miios-launch web
bindsym $mod+Return exec miios-launch terminal
bindsym Ctrl+Alt+Delete exec miios-launch home

# ThinkPad Fn keys: brightness and volume.
bindsym --locked XF86MonBrightnessUp exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown exec brightnessctl set 5%-
bindsym --locked XF86AudioRaiseVolume exec miios-volume up
bindsym --locked XF86AudioLowerVolume exec miios-volume down
bindsym --locked XF86AudioMute exec miios-volume mute
# Also: Ctrl+⊞+Up / Ctrl+⊞+Down change the volume (handy if the Fn keys are set the other way round).
bindsym Ctrl+$mod+Up exec miios-volume up
bindsym Ctrl+$mod+Down exec miios-volume down

# A slim pastel bar on top: click "Home" (or any open app) to switch.
bar {
    position top
    height 42
    status_command miios-status
    strip_workspace_numbers yes
    font pango:DejaVu Sans Bold 14
    colors {
        background #FFFFFF
        statusline #3A3F58
        separator #DDE3EE
        focused_workspace  #35B6F2 #35B6F2 #FFFFFF
        active_workspace   #CDEBFF #CDEBFF #3A3F58
        inactive_workspace #F4F6FB #F4F6FB #3A3F58
        urgent_workspace   #FF6F91 #FF6F91 #FFFFFF
    }
}

# Start on the home workspace with the MiiOS home screen.
workspace "1:Home"
exec miios-start-shell
exec miios-update-apps --loop

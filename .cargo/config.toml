[build]
# Always build for bare metal (no OS) instead of for Linux.
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    # (The linker script is added by kernel/build.rs.)
    # Put the kernel at a fixed address in the top 2 GiB of memory ("higher half").
    "-C", "relocation-model=static",
    "-C", "code-model=kernel",
    "-C", "link-arg=--gc-sections",
    # Note: this target already turns SSE/AVX off, so we never need to save
    # vector registers on interrupts or task switches (simpler + faster).
]
